# Producción: sin valores por defecto, si falta una variable la aplicación no arranca
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
cundiapp.jwt.secreto=${JWT_SECRETO}
# El código de verificación siempre sale por correo real: sin estas variables no arranca
spring.mail.host=${CORREO_SMTP_HOST}
spring.mail.username=${CORREO_SMTP_USUARIO}
spring.mail.password=${CORREO_SMTP_CLAVE}
cundiapp.google.client-id=${GOOGLE_CLIENT_ID}
# Registros como flujo de eventos (12 factores, factor 11, SCRUM-213): un JSON por línea en la salida estándar, con
# el id de la petición (clave «peticion», ver IdDePeticionFilter), para poder buscar y filtrar sin leer texto.
logging.structured.format.console=ecs
logging.structured.ecs.service.name=cundiapp
logging.structured.ecs.service.environment=${PERFIL:prod}
# Documentación automática deshabilitada en PROD (sección 10 de la guía)
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
