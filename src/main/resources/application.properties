spring.application.name=cundiapp
spring.profiles.active=${PERFIL:local}
server.port=${PORT:8080}

# En local se leen las variables del archivo .env (no se versiona). En PRE y PROD las entrega el hosting.
spring.config.import=optional:file:.env[.properties]

# Base de datos: los valores por defecto son solo para el PostgreSQL local de docker-compose.yml
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cundiapp}
spring.datasource.username=${DB_USERNAME:cundiapp}
spring.datasource.password=${DB_PASSWORD:}
# Toda conexión trabaja sobre el esquema del modelo, sin escribir cundiapp. antes de cada tabla
spring.datasource.hikari.schema=cundiapp

# El esquema lo gobiernan las migraciones de Flyway; Hibernate solo valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=cundiapp
spring.flyway.schemas=cundiapp
spring.flyway.default-schema=cundiapp

# Los errores de validación (400) también salen como ProblemDetail, igual que los de dominio
spring.mvc.problemdetails.enabled=true

# Correo del código de verificación. Sin CORREO_SMTP_HOST, en local el código sale en la consola.
# Con Gmail: smtp.gmail.com, puerto 587 y una contraseña de aplicación (no la contraseña de la cuenta).
spring.mail.host=${CORREO_SMTP_HOST:}
spring.mail.port=${CORREO_SMTP_PUERTO:587}
spring.mail.username=${CORREO_SMTP_USUARIO:}
spring.mail.password=${CORREO_SMTP_CLAVE:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Que un servidor de correo lento no deje colgado el registro (milisegundos)
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
cundiapp.correo.remitente=${CORREO_REMITENTE:${CORREO_SMTP_USUARIO:}}
# /actuator/health no debe abrir una conexión SMTP en cada consulta
management.health.mail.enabled=false

# Inicio con Google (SCRUM-48): el client ID es público (también va en el frontend). Vacío = Google no disponible.
cundiapp.google.client-id=${GOOGLE_CLIENT_ID:}

cundiapp.cors.origenes-permitidos=${CORS_ORIGENES:http://localhost:4200}
# Valor solo para desarrollo local y pruebas. application-pre y application-prod lo reemplazan
# leyendo JWT_SECRETO sin valor por defecto: si falta, esos ambientes no arrancan.
cundiapp.jwt.secreto=${JWT_SECRETO:solo-para-desarrollo-local-no-usar-en-pre-ni-en-prod}
# La cookie de refresco es Secure; el navegador la acepta también en http://localhost
cundiapp.refresco.cookie-secure=${COOKIE_SECURE:true}
cundiapp.jwt.duracion-acceso=${JWT_DURACION_ACCESO:PT20M}
cundiapp.jwt.duracion-refresco=${JWT_DURACION_REFRESCO:P7D}
