# CundiApp - base de datos de desarrollo
#
# Levanta PostgreSQL 17 en tu máquina. El esquema NO se carga aquí: lo aplica
# Flyway (src/main/resources/db/migration) cuando arranca el backend.
#
#   1. Copia .env.example como .env y define DB_PASSWORD.
#   2. docker compose up -d
#   3. Empezar de cero (borra los datos):  docker compose down -v
#
# Si ya tienes un PostgreSQL propio en el 5432, cambia el puerto de la izquierda
# (por ejemplo 127.0.0.1:5433:5432) y ajusta DB_URL en .env.
#
# Aqui no se usa "container_name" a proposito: ese nombre es global en Docker, no del proyecto, asi
# que con uno fijo no se puede levantar una segunda copia (para probar una rama, por ejemplo) sin que
# choquen. Compose los nombra <proyecto>-<servicio>-1, y a los contenedores se llega por el nombre
# del SERVICIO, que es lo que entienden tanto Compose como el DNS interno:
#
#   docker compose exec db psql -U cundiapp -d cundiapp
#   docker compose logs -f backend
#
# Eso tambien vale si alguien levanta el proyecto con otro nombre (-p), que con nombres fijos fallaba.

services:
  db:
    image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    restart: unless-stopped
    environment:
      POSTGRES_DB: cundiapp
      POSTGRES_USER: ${DB_USERNAME:-cundiapp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
      TZ: America/Bogota
    # Solo desde esta maquina (127.0.0.1): sin esto, cualquiera en la misma red podria intentar conectarse.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cundiapp-datos:/var/lib/postgresql/data
    # Ningun binario con setuid dentro de la imagen puede ganar privilegios, ni siquiera los que ya tiene.
    security_opt:
      - no-new-privileges:true
    # Sin ninguna capacidad del nucleo salvo las cinco que el arranque de postgres necesita de verdad:
    # inicializar el directorio de datos (CHOWN, FOWNER, DAC_OVERRIDE) y bajar de root al usuario
    # postgres (SETUID, SETGID). Las demas (NET_RAW, MKNOD, NET_ADMIN...) no las usa.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    # A diferencia del backend y del frontend, aqui no se pone read_only: la imagen oficial escribe en
    # /var/run/postgresql y en el propio directorio de datos durante el arranque.
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-cundiapp} -d cundiapp"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
      # Mientras arranca pregunta cada 2 s y no cada 10: PostgreSQL esta listo en unos 3 s.
      start_interval: 2s

  # Opcional: interfaz web para mirar las tablas. Solo arranca con
  #   docker compose --profile herramientas up -d
  # Entra en http://localhost:8081 y conecta al servidor "db", puerto 5432. Requiere PGADMIN_PASSWORD en .env:
  # no hay clave por defecto, y sin ella el contenedor se niega a arrancar.
  pgadmin:
    # Version fija: con "latest" la herramienta cambia sola de un dia para otro. Se sube a mano cuando haga falta.
    image: dpage/pgadmin4:9.18@sha256:c332c5f6dfba995d9ebc4af261d93506d6876085d712eaaa3defc8dd1a3f26de
    profiles: ["herramientas"]
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$$PGADMIN_DEFAULT_PASSWORD" ]; then
          echo "Define PGADMIN_PASSWORD en el archivo .env" >&2
          exit 1
        fi
        exec /entrypoint.sh
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@cundiapp.dev}
      # Con ":-" y no con ":?": Compose evalua las variables de TODOS los servicios aunque su perfil no
      # este activo, y con ":?" un .env sin esta clave impedia hasta `--profile app up`, que ni usa pgAdmin.
      # La negativa a arrancar sin clave sigue, pero ahora la da el contenedor (ver "entrypoint").
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-}
      # True y no False: en modo escritorio pgAdmin no pide credenciales y queda una consola con acceso
      # total a la base abierta a cualquiera que llegue al puerto. Ahora exige el correo y la clave de
      # arriba. Es una herramienta de desarrollo, pero una sin contrasena no se justifica.
      PGADMIN_CONFIG_SERVER_MODE: "True"
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - cundiapp-pgadmin:/var/lib/pgadmin
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    depends_on:
      db:
        condition: service_healthy

  # ---- La aplicacion completa (SCRUM-70) ---------------------------------------------------------
  # Solo arranca con el perfil "app", y construye las imagenes desde el codigo de este mismo equipo:
  #
  #   docker compose --profile app up --build
  #
  # Entra en http://localhost:4200. Necesita el repositorio Frontend al lado de este (../Frontend).
  # Usa el perfil "local" del backend: contrasena de firma de desarrollo y codigos de verificacion
  # en la consola (docker compose logs backend), asi que no manda correos de verdad.
  backend:
    profiles: ["app"]
    build: .
    restart: unless-stopped
    # Mas que el apagado ordenado de Spring (25 s): con los 10 s por defecto de Docker se mataba a medio apagar.
    stop_grace_period: 40s
    # Solo desde esta maquina (127.0.0.1), como la base: deja abrir Swagger (http://localhost:8080/swagger-ui.html) y
    # probar la API directo con el perfil app. Si corres el backend con mvnw en el 8080, no levantes este perfil.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PERFIL: local
      DB_URL: jdbc:postgresql://db:5432/cundiapp
      DB_USERNAME: ${DB_USERNAME:-cundiapp}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
      # Se entra por http://localhost, sin https: la cookie de refresco no puede ser Secure.
      COOKIE_SECURE: "false"
      # Vacio a proposito: el codigo de verificacion sale por la consola y no por correo real.
      CORREO_SMTP_HOST: " "
      CORS_ORIGENES: http://localhost:4200
      # «Iniciar con Google» (es el ID público de cliente, no un secreto). Vacío = las rutas de Google responden 503 y el resto sigue igual.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # RF10, avisos con Web Push. Vacías = los avisos solo se ven dentro de la aplicación (ver el README para
      # generar las llaves). AVISOS_CADA y AVISOS_ESPERA_INICIAL (por ejemplo PT10S) acortan la ronda para demostrar.
      VAPID_PUBLICA: ${VAPID_PUBLICA:-}
      VAPID_PRIVADA: ${VAPID_PRIVADA:-}
      VAPID_SUJETO: ${VAPID_SUJETO:-}
      AVISOS_CADA: ${AVISOS_CADA:-PT5M}
      AVISOS_ESPERA_INICIAL: ${AVISOS_ESPERA_INICIAL:-PT1M}
    depends_on:
      db:
        condition: service_healthy
    # Sin "ports": solo el frontend lo alcanza, por la red interna. Descomenta para llamarlo directo.
    # ports:
    #   - "8080:8080"
    security_opt:
      - no-new-privileges:true
    # Ni una capacidad del nucleo: la imagen ya arranca como el usuario "cundiapp" (USER en el
    # Dockerfile), no cambia de identidad ni abre puertos por debajo del 1024.
    cap_drop:
      - ALL
    # El disco es de solo lectura: la aplicacion solo lee su propio jar. Lo unico que Java necesita
    # escribir son sus temporales, y van a memoria (tmpfs), que desaparece al apagar el contenedor.
    read_only: true
    # mode=1777 como el /tmp de cualquier sistema: un tmpfs se monta como root y la imagen corre como
    # el usuario "cundiapp". Java escribe aqui sus temporales, y PDFBox los suyos al leer un reporte.
    tmpfs:
      - /tmp:mode=1777
    # Sin este limite, el -XX:MaxRAMPercentage=75 del Dockerfile se calcula sobre la RAM del equipo
    # completo: una fuga de memoria se llevaria la maquina y no solo el contenedor.
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "2.0"

  frontend:
    profiles: ["app"]
    build:
      # La ruta del otro repositorio es configurable: por defecto el repositorio hermano, como estaba,
      # pero sin quedar clavada. Asi tambien funciona desde un worktree o desde un CI que clona en otra
      # carpeta, donde "../Frontend" no existe. Se cambia con RUTA_FRONTEND en el .env.
      context: ${RUTA_FRONTEND:-../Frontend}
      args:
        CONFIGURACION: dev
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "4200:8080"
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    # nginx-unprivileged ya corre como el usuario 101 y escucha en el 8080, asi que no necesita
    # NET_BIND_SERVICE ni ninguna otra capacidad.
    cap_drop:
      - ALL
    # Disco de solo lectura: el sitio compilado solo se lee. Las tres rutas que nginx si escribe van a
    # memoria: su configuracion renderizada con envsubst, su cache y sus temporales.
    #
    # El uid/gid 101 NO es decoracion: un tmpfs se monta como root y la imagen corre como el usuario
    # 101, asi que sin esto el entrypoint no puede escribir la configuracion renderizada
    # ("/etc/nginx/conf.d is not writable"), nginx arranca sin ningun bloque server y no escucha nada.
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:uid=101,gid=101
      - /var/cache/nginx:uid=101,gid=101
      - /tmp:uid=101,gid=101
    # Servir archivos estaticos no necesita mas: si pide mas que esto, algo va mal.
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "1.0"

volumes:
  cundiapp-datos:
  cundiapp-pgadmin:
