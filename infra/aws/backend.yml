AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  CundiApp - el backend de UN ambiente en ECS Fargate detras de un balanceador de carga (SCRUM-71).
  Lo despliega el CI en cada push, pasando la imagen nueva como parametro: CloudFormation registra la
  definicion de tarea nueva, hace el despliegue gradual y, si la tarea nueva no queda sana, vuelve sola
  a la anterior.

Parameters:
  Entorno:
    Type: String
    AllowedValues: [dev, preprod, prod]
  ImagenUri:
    Type: String
    Description: Imagen completa con su etiqueta, p. ej. 123456789012.dkr.ecr.us-east-1.amazonaws.com/cundiapp-backend:dev-ab12cd3
  PerfilDeSpring:
    Type: String
    AllowedValues: [pre, prod]
    Description: >-
      pre para dev y preprod, prod para prod. Ambos exigen todas las variables (sin valores por defecto),
      asi que una configuracion incompleta hace fallar el arranque en vez de funcionar a medias.
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubredesPublicas:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Al menos dos, en zonas de disponibilidad distintas (lo exige el balanceador).
  ListaDePrefijosCloudFront:
    Type: String
    AllowedPattern: '^pl-[0-9a-f]+$'
    Description: >-
      Lista administrada por AWS con las IP de CloudFront. Se obtiene con: aws ec2 describe-managed-prefix-lists
      --filters Name=prefix-list-name,Values=com.amazonaws.global.cloudfront.origin-facing
  RolDeEjecucionArn:
    Type: String
  RolDeTareaArn:
    Type: String
  GrupoDeLogs:
    Type: String
  OrigenPermitido:
    Type: String
    Description: >-
      Origen del frontend (https://dxxxx.cloudfront.net). Va a CORS_ORIGENES. Spring compara el Origin del
      navegador con el Host que le llega, y detras de CloudFront no coinciden, asi que tiene que estar.
  TareasDeseadas:
    Type: Number
    Default: 1
    MinValue: 1
    Description: Usa 2 en prod, en zonas distintas, para que una falla de zona no tumbe el servicio.
  SaltosDeProxy:
    Type: Number
    Default: 2
    AllowedValues: [1, 2]
    Description: >-
      Proxies delante de la aplicacion: CloudFront y el balanceador son 2. Es lo que permite limitar por la
      IP real del estudiante y no por la del balanceador (ver IpDelCliente).
  Cpu:
    Type: String
    Default: '512'
    AllowedValues: ['256', '512', '1024']
  Memoria:
    Type: String
    Default: '1024'
    AllowedValues: ['1024', '2048']

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub cundiapp-${Entorno}

  # ---- Red: solo CloudFront entra al balanceador, y solo el balanceador entra a las tareas ----------
  GrupoDeSeguridadBalanceador:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub CundiApp ${Entorno} - balanceador (solo CloudFront)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref ListaDePrefijosCloudFront
          Description: CloudFront

  GrupoDeSeguridadTarea:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub CundiApp ${Entorno} - tareas del backend
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref GrupoDeSeguridadBalanceador
          Description: Solo el balanceador
      # Salida abierta: la tarea habla con Supabase (5432), el SMTP (587), Google y AWS (ECR, SSM).

  SalidaDelBalanceadorALasTareas:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref GrupoDeSeguridadBalanceador
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      DestinationSecurityGroupId: !Ref GrupoDeSeguridadTarea

  # ---- Balanceador ------------------------------------------------------------------------------
  Balanceador:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub cundiapp-${Entorno}
      Type: application
      Scheme: internet-facing
      Subnets: !Ref SubredesPublicas
      SecurityGroups: [!Ref GrupoDeSeguridadBalanceador]
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: '60'
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'

  GrupoDeDestino:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub cundiapp-${Entorno}
      VpcId: !Ref VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      # readiness y no la salud agregada: esa incluye la base de datos, y un parpadeo de Supabase daria
      # de baja todas las tareas a la vez. Ademas readiness pasa a "no acepta trafico" cuando la tarea
      # recibe SIGTERM, y asi el balanceador deja de mandarle peticiones mientras termina las que lleva.
      HealthCheckPath: /actuator/health/readiness
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'

  # Lo que no trae el secreto que CloudFront agrega recibe 403: aunque alguien conozca el DNS del
  # balanceador o tenga su propia distribucion de CloudFront, no llega a la aplicacion.
  Escucha:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Balanceador
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '403'
            ContentType: text/plain
            MessageBody: Forbidden

  ReglaDeCloudFront:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref Escucha
      Priority: 1
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Origin-Verify
            Values:
              - !Sub '{{resolve:ssm:/cundiapp/${Entorno}/ORIGIN_VERIFY}}'
      Actions:
        - Type: forward
          TargetGroupArn: !Ref GrupoDeDestino

  # ---- La tarea y el servicio ----------------------------------------------------------------------
  DefinicionDeTarea:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub cundiapp-${Entorno}-backend
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref Cpu
      Memory: !Ref Memoria
      ExecutionRoleArn: !Ref RolDeEjecucionArn
      TaskRoleArn: !Ref RolDeTareaArn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: backend
          Image: !Ref ImagenUri
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          # Mas que spring.lifecycle.timeout-per-shutdown-phase (25 s): si no, ECS mata la tarea con SIGKILL
          # antes de que termine las peticiones en curso.
          StopTimeout: 35
          Environment:
            - { Name: PERFIL, Value: !Ref PerfilDeSpring }
            - { Name: CORS_ORIGENES, Value: !Ref OrigenPermitido }
            - { Name: SALTOS_DE_PROXY, Value: !Ref SaltosDeProxy }
            - { Name: COOKIE_SECURE, Value: 'true' }
            - { Name: TZ, Value: America/Bogota }
          # Los secretos nunca estan en la plantilla ni en el CI: ECS los lee de Parameter Store al arrancar.
          Secrets:
            - { Name: DB_URL, ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cundiapp/${Entorno}/DB_URL' }
            - { Name: DB_USERNAME, ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cundiapp/${Entorno}/DB_USERNAME' }
            - { Name: DB_PASSWORD, ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cundiapp/${Entorno}/DB_PASSWORD' }
            - { Name: JWT_SECRETO, ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cundiapp/${Entorno}/JWT_SECRETO' }
            - { Name: CORREO_SMTP_HOST, ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cundiapp/${Entorno}/CORREO_SMTP_HOST' }
            - { Name: CORREO_SMTP_USUARIO, ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cundiapp/${Entorno}/CORREO_SMTP_USUARIO' }
            - { Name: CORREO_SMTP_CLAVE, ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cundiapp/${Entorno}/CORREO_SMTP_CLAVE' }
            - { Name: GOOGLE_CLIENT_ID, ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cundiapp/${Entorno}/GOOGLE_CLIENT_ID' }
          HealthCheck:
            Command: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/actuator/health/readiness || exit 1']
            Interval: 15
            Timeout: 3
            Retries: 3
            StartPeriod: 90
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref GrupoDeLogs
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: backend

  Servicio:
    Type: AWS::ECS::Service
    DependsOn: ReglaDeCloudFront
    Properties:
      ServiceName: backend
      Cluster: !Ref Cluster
      TaskDefinition: !Ref DefinicionDeTarea
      LaunchType: FARGATE
      DesiredCount: !Ref TareasDeseadas
      # Sin caida: primero sube la tarea nueva (hasta el 200 %) y recien cuando esta sana baja la vieja
      # (nunca menos del 100 %). Si la nueva no queda sana, el interruptor la revierte solo.
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      # Tiempo en que se ignoran las fallas del balanceador mientras Spring arranca y Flyway migra.
      HealthCheckGracePeriodSeconds: 120
      NetworkConfiguration:
        AwsvpcConfiguration:
          # IP publica para poder salir a Supabase, al SMTP y a ECR sin pagar un NAT. La entrada sigue
          # cerrada: el grupo de seguridad solo deja pasar al balanceador.
          AssignPublicIp: ENABLED
          Subnets: !Ref SubredesPublicas
          SecurityGroups: [!Ref GrupoDeSeguridadTarea]
      LoadBalancers:
        - ContainerName: backend
          ContainerPort: 8080
          TargetGroupArn: !Ref GrupoDeDestino

Outputs:
  DnsDelBalanceador:
    Description: >-
      Es el origen de /api/* en CloudFront (frontend.yml). No se abre en el navegador, porque responde 403.
    Value: !GetAtt Balanceador.DNSName
  Cluster:
    Value: !Ref Cluster
  Servicio:
    Value: !GetAtt Servicio.Name
