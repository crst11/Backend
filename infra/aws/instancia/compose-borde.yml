# La puerta de entrada de la instancia: una nginx que atiende a los dos ambientes (SCRUM-71).
# Produccion entra por el puerto 80 y preproduccion por el 8081; su configuracion la genera desplegar.sh.
name: cundiapp-borde

services:
  borde:
    # Fijada por digest (SCRUM-214): con "alpine" a secas, cada "docker compose pull" podia traer otra version de nginx
    # justo en la puerta de entrada de produccion. Para refrescarla: infra/actualizar-imagenes-base.sh.
    image: public.ecr.aws/nginx/nginx-unprivileged:alpine@sha256:378d0c32f6562f7fd9629170797f57d2b953aa09be983b3daaf4809bb039ca00
    container_name: cundiapp-borde
    restart: unless-stopped
    ports:
      - "80:8080"
      - "8081:8081"
    volumes:
      # Reemplaza la carpeta entera, incluido el default.conf de la imagen.
      - /opt/cundiapp/borde/conf.d:/etc/nginx/conf.d:ro
    networks: [cundiapp]
    mem_limit: 64m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  cundiapp:
    external: true
