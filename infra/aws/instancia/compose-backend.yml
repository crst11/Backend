# El backend de UN ambiente en la instancia (SCRUM-71). desplegar.sh exporta las variables antes de llamar
# a "docker compose": los secretos pasan por el entorno del proceso y no se escriben en ningun archivo.
# El ":?" hace que falte lo que falte, el despliegue falle de inmediato y diga que variable era.

# Las variables que comparten el backend y el migrador: la misma imagen, la misma base de datos, los mismos secretos.
x-entorno: &entorno
  PERFIL: ${PERFIL:?falta PERFIL}
  DB_URL: ${DB_URL:?falta DB_URL}
  DB_USERNAME: ${DB_USERNAME:?falta DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD}
  JWT_SECRETO: ${JWT_SECRETO:?falta JWT_SECRETO}
  CORREO_SMTP_HOST: ${CORREO_SMTP_HOST:?falta CORREO_SMTP_HOST}
  CORREO_SMTP_USUARIO: ${CORREO_SMTP_USUARIO:?falta CORREO_SMTP_USUARIO}
  CORREO_SMTP_CLAVE: ${CORREO_SMTP_CLAVE:?falta CORREO_SMTP_CLAVE}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?falta GOOGLE_CLIENT_ID}
  CORS_ORIGENES: ${CORS_ORIGENES:?falta CORS_ORIGENES}
  COOKIE_SECURE: "true"
  # CloudFront y la nginx de esta instancia: dos proxies delante (ver IpDelCliente).
  SALTOS_DE_PROXY: "2"
  TZ: America/Bogota
  # RF10: avisos con Web Push (SCRUM-37). Vacías = los avisos se ven solo dentro de la aplicación.
  VAPID_PUBLICA: ${VAPID_PUBLICA:-}
  VAPID_PRIVADA: ${VAPID_PRIVADA:-}
  VAPID_SUJETO: ${VAPID_SUJETO:-}
  # Serial GC y pilas chicas: menos memoria por hilo y sin los hilos de recoleccion paralela.
  # SCRUM-240: en el pico de carga la JVM llegaba a 448 MiB residentes, el limite exacto del contenedor. Lo que mas pesaba no era el heap ni los
  # hilos sino el compilador C2: con 1 CPU compite con las peticiones mientras la JVM se calienta y su codigo ocupa memoria. Con solo C1
  # (TieredStopAtLevel=1) y el codigo compilado acotado a 64 MiB, el pico baja a 330 MiB y la latencia y el rendimiento mejoran (docs/pruebas.md).
  # El techo del heap (60 %) no se toca: bajarlo no redujo el pico y arriesga quedarse sin memoria con varios analisis de PDF a la vez.
  JAVA_TOOL_OPTIONS: >-
    -XX:+UseSerialGC -XX:MaxRAMPercentage=60 -Xss512k -XX:MaxMetaspaceSize=128m
    -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=64m
    -XX:+ExitOnOutOfMemoryError -Djava.awt.headless=true
  # Hilos de Tomcat (200 por defecto): con un pool de 5 conexiones a la base, mas de 50 peticiones en vuelo solo hacen fila y gastan memoria.
  SERVER_TOMCAT_THREADS_MAX: "50"

services:
  backend:
    image: ${IMAGEN:?falta IMAGEN}
    # Sin container_name a proposito (SCRUM-229): el relevo sin caida (relevo.sh) corre el contenedor nuevo JUNTO al viejo, y un nombre
    # fijo no admite dos. Compose los nombra cundiapp-<ambiente>-backend-<n>; a ellos se llega por el alias de red backend-<ambiente>.
    restart: unless-stopped
    # El apagado ordenado de Spring espera hasta 25 s a que terminen las peticiones en curso
    # (spring.lifecycle.timeout-per-shutdown-phase). Docker, por defecto, mata el contenedor a los 10 s, y entonces
    # ese apagado no alcanza a completarse: cada despliegue cortaba lo que estuviera a medias. 40 s son los 25 de
    # Spring mas el margen de la JVM; ApagadoOrdenadoTest vigila que sigan siendo mas que los de Spring.
    stop_grace_period: 40s
    # Medido con esta misma imagen: cada JVM usa unos 315 MiB bajo un limite de 448 MiB, sin OOM tras 80
    # peticiones. Dos JVM suman unos 630 MiB, por eso este servidor necesita 2 GiB para alojar los dos ambientes.
    mem_limit: ${MEMORIA_BACKEND:-448m}
    memswap_limit: ${MEMORIA_BACKEND:-448m}
    # Preproduccion y produccion comparten esta maquina (SCRUM-229). Bajo presion de memoria el nucleo mata primero a quien tenga el
    # oom_score_adj mas alto (preproduccion: +300, produccion: -300), y bajo presion de CPU reparte por cpu_shares (produccion el doble).
    # desplegar.sh los fija por ambiente; sin presion no cambian nada.
    oom_score_adj: ${OOM_SCORE_ADJ:-0}
    cpu_shares: ${CPU_SHARES:-1024}
    environment:
      <<: *entorno
      # Las migraciones las corre el servicio "migrador" ANTES de levantar esta version (SCRUM-217, 12 factores,
      # factor 12). Si por error faltara alguna, Hibernate (ddl-auto=validate) se niega a arrancar y lo dice, que es
      # mejor que migrar a mitad del arranque.
      SPRING_FLYWAY_ENABLED: "false"
    networks:
      cundiapp:
        aliases:
          - backend-${ENTORNO}
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Paso de administracion de una sola ejecucion (SCRUM-217): migra el esquema con la MISMA imagen que se va a
  # desplegar y sale. desplegar.sh lo corre con "docker compose run --rm migrador" antes de "up -d"; el perfil evita que
  # "up" lo arranque por su cuenta. Si falla, el despliegue se aborta y el backend vigente ni se toca.
  migrador:
    image: ${IMAGEN:?falta IMAGEN}
    profiles: ["migracion"]
    restart: "no"
    mem_limit: ${MEMORIA_BACKEND:-448m}
    memswap_limit: ${MEMORIA_BACKEND:-448m}
    environment:
      <<: *entorno
      CUNDIAPP_MIGRAR_Y_SALIR: "true"
      SPRING_FLYWAY_ENABLED: "true"
      # Ni la ronda de avisos ni la limpieza de limites: este contenedor solo migra.
      CUNDIAPP_AVISOS_PROGRAMADOS: "false"
    # Sin el alias backend-<ambiente>: ese nombre es de la nginx de borde para llegar al backend, y un segundo
    # contenedor con el mismo le mandaria trafico a algo que no escucha.
    networks:
      - cundiapp
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  cundiapp:
    external: true
