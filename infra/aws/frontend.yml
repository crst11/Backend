AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  CundiApp - el frontend de UN ambiente: bucket privado de S3 detras de CloudFront, y /api/* reenviado a la
  instancia del backend. El navegador ve un solo origen (SCRUM-71). Lo despliega una persona, una vez por
  ambiente, despues de servidor.yml; el CI del frontend solo sube archivos y limpia el cache.

Parameters:
  Entorno:
    Type: String
    AllowedValues: [preprod, prod]
    Description: Desarrollo no tiene frontend en la nube (se queda local, con Docker Compose).
  DominioDelServidor:
    Type: String
    Description: Salida DominioDelServidor de la pila cundiapp-servidor.
  PuertoDelServidor:
    Type: Number
    AllowedValues: [80, 81]
    Description: 80 para prod y 81 para preprod. Es lo que separa a los dos ambientes en la misma instancia.
  ClaseDePrecio:
    Type: String
    Default: PriceClass_All
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]
    Description: >-
      PriceClass_All incluye los puntos de presencia de Sudamerica (Bogota). Con poco trafico la diferencia
      de costo con PriceClass_100 es de centavos y el estudiante en Colombia gana latencia.

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub cundiapp-frontend-${Entorno}-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      # Con versiones, volver a un frontend anterior es restaurar archivos y no reconstruir nada.
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: versiones-viejas
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30

  AccesoAlBucket:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub cundiapp-${Entorno}-frontend
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Una Single Page Application responde index.html para rutas como /cuenta/entrar, que no existen como
  # archivo. La forma habitual (errores 403/404 -> index.html) vale para TODA la distribucion y tambien
  # reescribiria los 403 y 404 reales de /api/* como un 200 con HTML. Esta funcion solo corre en el
  # comportamiento del frontend, asi que la API conserva sus errores.
  FuncionSpa:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub cundiapp-${Entorno}-spa
      AutoPublish: true
      FunctionConfig:
        Comment: Rutas de Angular sin extension responden index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var peticion = event.request;
          var ultimo = peticion.uri.split('/').pop();
          if (ultimo.indexOf('.') === -1) {
            peticion.uri = '/index.html';
          }
          return peticion;
        }

  CabecerasDeSeguridad:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub cundiapp-${Entorno}-seguridad
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true

  Distribucion:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub CundiApp ${Entorno}
        HttpVersion: http2and3
        PriceClass: !Ref ClaseDePrecio
        DefaultRootObject: index.html
        Origins:
          - Id: frontend
            DomainName: !GetAtt Bucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !GetAtt AccesoAlBucket.Id
          - Id: backend
            DomainName: !Ref DominioDelServidor
            CustomOriginConfig:
              # La instancia no tiene dominio propio ni certificado, asi que CloudFront le habla por http.
              # Solo la alcanzan las IP de CloudFront, y nginx rechaza lo que no traiga el secreto de abajo.
              OriginProtocolPolicy: http-only
              HTTPPort: !Ref PuertoDelServidor
              OriginReadTimeout: 30
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !Sub '{{resolve:ssm:/cundiapp/${Entorno}/ORIGIN_VERIFY}}'
        DefaultCacheBehavior:
          TargetOriginId: frontend
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          # Managed-CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref CabecerasDeSeguridad
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt FuncionSpa.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: backend
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            Compress: true
            # Managed-CachingDisabled: la API jamas se cachea.
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # Managed-AllViewer: reenvia encabezados, cookies (la de refresco) y parametros tal cual.
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3

  PoliticaDelBucket:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SoloEstaDistribucionDeCloudFront
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${Bucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribucion}

Outputs:
  Bucket:
    Value: !Ref Bucket
  IdDeDistribucion:
    Value: !Ref Distribucion
  DominioDeCloudFront:
    Description: >-
      La direccion de la app. Va como CORS_ORIGENES del backend (OrigenPermitido) y en los origenes
      autorizados del cliente OAuth de Google.
    Value: !GetAtt Distribucion.DomainName
