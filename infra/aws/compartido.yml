AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  CundiApp - el repositorio de imagenes (ECR). Se despliega UNA vez por cuenta de AWS (SCRUM-71).

Resources:
  # Etiquetas inmutables: una etiqueta publicada no se puede reemplazar, asi que "prod-1.2.0" siempre
  # es la misma imagen. Solo preproduccion y produccion publican aqui; desarrollo se construye en el CI
  # y se descarta, sin salir a la nube.
  #
  # NIVEL GRATUITO: ECR incluye 500 MB de almacenamiento privado y la imagen pesa unos 430 MB. Las capas
  # se comparten entre etiquetas, y una nueva solo suma la capa de la aplicacion, pero el margen es
  # estrecho: por eso solo se conservan las 2 mas recientes de cada ambiente (la actual y la anterior,
  # que es la que hace falta para volver atras). Mira Billing > Free Tier si cambias esto.
  RepositorioBackend:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: cundiapp-backend
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              { "rulePriority": 1, "description": "Imagenes sin etiqueta: 1 dia",
                "selection": { "tagStatus": "untagged", "countType": "sinceImagePushed", "countUnit": "days", "countNumber": 1 },
                "action": { "type": "expire" } },
              { "rulePriority": 2, "description": "preprod: las 2 ultimas",
                "selection": { "tagStatus": "tagged", "tagPrefixList": ["preprod-"], "countType": "imageCountMoreThan", "countNumber": 2 },
                "action": { "type": "expire" } },
              { "rulePriority": 3, "description": "prod: las 2 ultimas",
                "selection": { "tagStatus": "tagged", "tagPrefixList": ["prod-"], "countType": "imageCountMoreThan", "countNumber": 2 },
                "action": { "type": "expire" } }
            ]
          }

Outputs:
  RepositorioUri:
    Value: !GetAtt RepositorioBackend.RepositoryUri
  RepositorioArn:
    Value: !GetAtt RepositorioBackend.Arn
