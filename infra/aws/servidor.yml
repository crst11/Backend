AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  CundiApp - UNA instancia EC2 con Docker que aloja el backend de preproduccion y el de produccion, sin
  balanceador de carga ni Fargate (SCRUM-71). Lo despliega una persona con permisos de administrador, una vez.
  El CI no toca esta pila: le manda ordenes a la instancia por SSM (ver infra/aws/instancia/desplegar.sh).

Parameters:
  TipoDeInstancia:
    Type: String
    Default: t4g.small
    AllowedValues: [t4g.small, t4g.micro, t3.small, t3.micro]
    Description: >-
      t4g.small (2 GiB, ARM) aloja los dos ambientes. t3.micro (1 GiB, x86) solo aguanta UNO: medido con la
      imagen real, cada JVM usa unos 315 MiB, y dos mas Docker, el sistema y el agente de SSM pasan de 1 GiB.
      Cual es gratis depende de tu cuenta: revisa Billing > Free Tier antes de crear nada. El periodo de
      prueba de t4g.small tiene fecha de fin.
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubredPublica:
    Type: AWS::EC2::Subnet::Id
    Description: Una subred con ruta a un Internet Gateway.
  ListaDePrefijosCloudFront:
    Type: String
    AllowedPattern: '^pl-[0-9a-f]+$'
    Description: >-
      Lista administrada por AWS con las IP de CloudFront. Se obtiene con: aws ec2 describe-managed-prefix-lists
      --filters Name=prefix-list-name,Values=com.amazonaws.global.cloudfront.origin-facing
  DiscoGiB:
    Type: Number
    Default: 20
    MinValue: 8
    MaxValue: 30
    Description: El nivel gratuito de EBS son 30 GiB en total.
  ImagenDeLaInstancia:
    Type: String
    Default: ''
    AllowedPattern: '^(ami-[0-9a-f]{8,17})?$'
    Description: >-
      AMI de la instancia. Vacio = la ultima de Amazon Linux 2023, que es lo que conviene al CREAR la pila. AL ACTUALIZARLA hay
      que pasar la AMI de la instancia que ya corre (SCRUM-224): con el valor vacio, ImageId se resuelve cada vez a la ultima AMI
      publicada, y apenas AWS publica una nueva CloudFormation REEMPLAZA la instancia (servidor de produccion y preproduccion),
      aunque lo unico que cambie sea un grupo de registros. Se obtiene con: aws ec2 describe-instances --instance-ids <id>
      --query Reservations[0].Instances[0].ImageId --output text
  RetencionDeRegistrosDias:
    Type: Number
    Default: 30
    AllowedValues: [7, 14, 30, 60, 90, 180, 365]
    Description: >-
      Cuantos dias guarda CloudWatch los registros del backend y de la puerta de entrada (SCRUM-222). Sin esto
      se guardarian para siempre y se pagarian. El nivel gratuito incluye 5 GB de ingesta al mes: el backend
      escribe unos pocos MB al dia.

Conditions:
  EsArm: !Or
    - !Equals [!Ref TipoDeInstancia, t4g.small]
    - !Equals [!Ref TipoDeInstancia, t4g.micro]
  EsUsEast1: !Equals [!Ref 'AWS::Region', us-east-1]
  ImagenFija: !Not [!Equals [!Ref ImagenDeLaInstancia, '']]

Resources:
  # Solo entra CloudFront, y solo a los puertos de los dos ambientes: 80 produccion y 8081 preproduccion.
  # No hay SSH: se entra con SSM Session Manager.
  #
  # Un grupo POR AMBIENTE y una sola regla en cada uno, a proposito. Una lista de prefijos administrada pesa en
  # el grupo tanto como su maximo de entradas (la de CloudFront, unas 55) y el limite es de 60 por grupo: dos reglas
  # con esa lista en el mismo grupo no caben, y un rango de puertos abriria miles de puertos a CloudFront para
  # alcanzar solo dos.
  GrupoDeProduccion:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CundiApp - backend de produccion (solo CloudFront, puerto 80)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref ListaDePrefijosCloudFront
          Description: CloudFront - produccion

  GrupoDePreproduccion:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CundiApp - backend de preproduccion (solo CloudFront, puerto 8081)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        # CloudFront no acepta el 81 como puerto de origen: solo 80, 443 o 1024-65535.
        - IpProtocol: tcp
          FromPort: 8081
          ToPort: 8081
          SourcePrefixListId: !Ref ListaDePrefijosCloudFront
          Description: CloudFront - preproduccion

  # Los registros salen del disco de la instancia (3 archivos de 10 MB que se pierden si la instancia se reemplaza) a
  # CloudWatch Logs (SCRUM-222, 12 factores, factor 11). Un grupo por ambiente, para poder dar permisos y buscar por
  # separado, y uno para la puerta de entrada que comparten. Son "Retain": los registros tienen que sobrevivir a la
  # instancia y a la pila (borrar la pila no los borra; si se vuelve a crear, hay que importar los grupos o borrarlos a mano). Los crea esta plantilla y no Docker
  # (awslogs-create-group queda en false): asi el rol de la instancia no necesita logs:CreateLogGroup y la retencion
  # queda definida desde el primer dia.
  RegistrosDePreproduccion:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /cundiapp/preprod/backend
      RetentionInDays: !Ref RetencionDeRegistrosDias

  RegistrosDeProduccion:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /cundiapp/prod/backend
      RetentionInDays: !Ref RetencionDeRegistrosDias

  RegistrosDeLaPuertaDeEntrada:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /cundiapp/borde
      RetentionInDays: !Ref RetencionDeRegistrosDias

  Rol:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cundiapp-servidor
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: bajar-imagenes-y-leer-secretos
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/cundiapp-backend
              # Los secretos de cada ambiente viven en /cundiapp/preprod/ y /cundiapp/prod/. El CI los escribe
              # desde los secretos del Environment de GitHub y la instancia los lee al desplegar.
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cundiapp/*
        # Escribir registros, y solo en los tres grupos de arriba. desplegar.sh crea un stream "sondeo" antes de arrancar
        # nada para comprobar que puede escribir; si no puede, el backend sigue registrando en el disco.
        - PolicyName: escribir-registros
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                # El Arn de un grupo de registros ya termina en ":*", que cubre sus streams.
                Resource:
                  - !GetAtt RegistrosDePreproduccion.Arn
                  - !GetAtt RegistrosDeProduccion.Arn
                  - !GetAtt RegistrosDeLaPuertaDeEntrada.Arn

  PerfilDeInstancia:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref Rol]

  Servidor:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref TipoDeInstancia
      ImageId: !If
        - ImagenFija
        - !Ref ImagenDeLaInstancia
        - !If
          - EsArm
          - '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64}}'
          - '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      IamInstanceProfile: !Ref PerfilDeInstancia
      SubnetId: !Ref SubredPublica
      SecurityGroupIds: [!Ref GrupoDeProduccion, !Ref GrupoDePreproduccion]
      Monitoring: false
      # IMDSv2 obligatorio: sin el, un fallo de la aplicacion que reenvie peticiones podria leer las credenciales.
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref DiscoGiB
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - { Key: Name, Value: cundiapp-servidor }
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euxo pipefail

          dnf install -y docker
          # Los registros del contenedor rotan: sin esto un disco de 20 GiB se llena en semanas.
          mkdir -p /etc/docker
          cat > /etc/docker/daemon.json <<'JSON'
          { "log-driver": "json-file", "log-opts": { "max-size": "10m", "max-file": "3" } }
          JSON
          systemctl enable --now docker

          # Docker Compose como complemento de Docker, con su suma de verificacion.
          VERSION=v2.29.7
          ARQ=$(uname -m)
          cd /tmp
          curl -fsSLO "https://github.com/docker/compose/releases/download/$VERSION/docker-compose-linux-$ARQ"
          curl -fsSLO "https://github.com/docker/compose/releases/download/$VERSION/docker-compose-linux-$ARQ.sha256"
          sha256sum -c "docker-compose-linux-$ARQ.sha256"
          mkdir -p /usr/local/lib/docker/cli-plugins
          install -m 0755 "docker-compose-linux-$ARQ" /usr/local/lib/docker/cli-plugins/docker-compose

          # 1 GiB de intercambio: red de seguridad contra un pico de memoria, no una forma de ir sobrado.
          fallocate -l 1G /swapfile
          chmod 600 /swapfile
          mkswap /swapfile
          swapon /swapfile
          echo '/swapfile none swap sw 0 0' >> /etc/fstab

          mkdir -p /opt/cundiapp/bin
          docker network create cundiapp || true

  # IP fija: CloudFront apunta al nombre DNS de la instancia, y con una IP automatica ese nombre cambiaria
  # cada vez que la instancia se detiene. Una sola IPv4 publica entra en el nivel gratuito de EC2.
  IpPublica:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  AsociacionDeIp:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt IpPublica.AllocationId
      InstanceId: !Ref Servidor

Outputs:
  IdDeInstancia:
    Value: !Ref Servidor
  IpPublica:
    Value: !Ref IpPublica
  Arquitectura:
    Description: Para construir la imagen de Docker de la plataforma correcta (arm64 o x86_64).
    Value: !If [EsArm, arm64, x86_64]
  DominioDelServidor:
    Description: Es el origen de /api/* en CloudFront (frontend.yml). No responde sin el encabezado secreto.
    Value: !If
      - EsUsEast1
      - !Sub
        - ec2-${Guiones}.compute-1.amazonaws.com
        - Guiones: !Join ['-', !Split ['.', !Ref IpPublica]]
      - !Sub
        - ec2-${Guiones}.${AWS::Region}.compute.amazonaws.com
        - Guiones: !Join ['-', !Split ['.', !Ref IpPublica]]
