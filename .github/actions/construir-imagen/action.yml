name: Construir la imagen del backend
description: >-
  Construye el Dockerfile y, si se pide, lo publica. Si el registro de las imagenes base limita las descargas
  (toomanyrequests, que pasa en los ejecutores compartidos de GitHub), repite la construccion con otro registro.

# Por que existe (SCRUM-202): el Dockerfile baja eclipse-temurin de public.ecr.aws sin autenticarse, y los
# ejecutores de GitHub comparten IP, asi que a veces el limite anonimo ya esta agotado y el despliegue falla antes
# de compilar una sola linea. SCRUM-101 ya lo habia resuelto para la nginx del CI; faltaba la imagen.
#
# Los tres registros publican las mismas imagenes oficiales, y ninguno pide credenciales:
#   1. public.ecr.aws/docker/library   el de siempre (el que usa el Dockerfile por defecto)
#   2. mirror.gcr.io/library            espejo de Docker Hub de Google
#   3. docker.io/library                Docker Hub
# Fallar al bajar una imagen no cuesta nada (falla al resolver los metadatos, antes de compilar), asi que
# probar el siguiente es barato. Si los tres fallan, el paso falla y el error es el del ultimo intento.

inputs:
  tags:
    description: Etiqueta(s) de la imagen.
    required: true
  push:
    description: Publicar la imagen en el registro de la etiqueta.
    default: 'false'
  load:
    description: Dejar la imagen en el Docker del ejecutor (solo para comprobar que construye).
    default: 'false'
  platforms:
    description: Plataforma de destino. Vacio = la del ejecutor.
    default: ''
  cache-scope:
    description: Nombre del cache de capas (gha).
    required: true

runs:
  using: composite
  steps:
    - id: ecr
      uses: docker/build-push-action@v7
      continue-on-error: true
      with:
        context: .
        push: ${{ inputs.push }}
        load: ${{ inputs.load }}
        platforms: ${{ inputs.platforms }}
        # Sin atestaciones: agregarian manifiestos extra a ECR, que tiene solo 500 MB gratis.
        provenance: false
        sbom: false
        tags: ${{ inputs.tags }}
        cache-from: type=gha,scope=${{ inputs.cache-scope }}
        cache-to: type=gha,scope=${{ inputs.cache-scope }},mode=max

    - id: espejo
      if: steps.ecr.outcome == 'failure'
      uses: docker/build-push-action@v7
      continue-on-error: true
      with:
        context: .
        push: ${{ inputs.push }}
        load: ${{ inputs.load }}
        platforms: ${{ inputs.platforms }}
        provenance: false
        sbom: false
        tags: ${{ inputs.tags }}
        build-args: REGISTRO=mirror.gcr.io/library
        cache-from: type=gha,scope=${{ inputs.cache-scope }}
        cache-to: type=gha,scope=${{ inputs.cache-scope }},mode=max

    - id: dockerhub
      if: steps.ecr.outcome == 'failure' && steps.espejo.outcome == 'failure'
      uses: docker/build-push-action@v7
      with:
        context: .
        push: ${{ inputs.push }}
        load: ${{ inputs.load }}
        platforms: ${{ inputs.platforms }}
        provenance: false
        sbom: false
        tags: ${{ inputs.tags }}
        build-args: REGISTRO=docker.io/library
        cache-from: type=gha,scope=${{ inputs.cache-scope }}
        cache-to: type=gha,scope=${{ inputs.cache-scope }},mode=max

    - name: Decir que registro se uso cuando no fue el de siempre
      if: steps.ecr.outcome == 'failure'
      shell: bash
      env:
        ESPEJO: ${{ steps.espejo.outcome }}
      run: |
        if [ "$ESPEJO" = "success" ]; then usado="mirror.gcr.io"; else usado="Docker Hub"; fi
        echo "::warning::public.ecr.aws limito las descargas (toomanyrequests); las imagenes base salieron de $usado."
