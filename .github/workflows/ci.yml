name: CI

on:
  pull_request:
    branches: [desarrollo, preproduccion, produccion]

jobs:
  verificar:
    name: Compilar, probar y verificar arquitectura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: mvnw verify
        run: ./mvnw -B verify
