name: CI

on:
  pull_request:
    branches: [desarrollo, preproduccion, produccion]

jobs:
  verificar:
    name: Compilar, probar y verificar arquitectura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: mvnw verify
        run: ./mvnw -B verify

  dependencias:
    name: Dependencias sin vulnerabilidades conocidas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # OSV-Scanner mira cada dependencia de pom.xml (tambien las transitivas) contra la base de
      # vulnerabilidades OSV, sin llave ni cuenta. Falla con cualquier aviso que no este en
      # osv-scanner.toml; ahi se documenta cada excepcion, con motivo y fecha limite.
      - name: Escanear pom.xml
        run: >
          docker run --rm -v "$PWD:/src:ro" ghcr.io/google/osv-scanner:v2.7.0@sha256:4f3b7e2c64b9d38a5febc5a7e4a3dfef1d1362f726dea7a2ef4762b46469fcd0
          scan source --config=/src/osv-scanner.toml --lockfile=/src/pom.xml

  # La nginx de borde la comparten preproduccion y produccion. Si la configuracion de un ambiente sale
  # invalida, el despliegue falla en la instancia y, peor, nginx no arranca en el siguiente reinicio
  # (SCRUM-101). Aqui se arma con el MISMO script que usa desplegar.sh y se prueba con nginx -t, con los
  # dos ambientes juntos, antes de fusionar.
  promocion-de-imagenes:
    name: Promocion de la imagen de preproduccion a produccion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Repositorios de git de mentira y un aws simulado: la promocion decide por el contenido (SCRUM-215) y un error
      # aqui desplegaria en produccion una imagen que no es la que se probo, o reconstruiria sin necesidad.
      - run: bash infra/probar-imagen-a-promover.sh

  borde:
    name: Configuracion de la puerta de entrada (nginx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Armar la configuracion de preproduccion y produccion y probarla con nginx -t
        run: |
          set -euo pipefail
          bash -n infra/aws/instancia/desplegar.sh
          bash -n infra/aws/instancia/renderizar-borde.sh
          # Un secreto de mentira con la forma que exige desplegar.sh (32 o mas letras y numeros).
          secreto="abcdefghij0123456789abcdefghij0123456789"
          conf="$RUNNER_TEMP/borde/conf.d"
          mkdir -p "$conf"
          bash infra/aws/instancia/renderizar-borde.sh 8080 "$secreto" backend-prod > "$conf/prod.conf"
          bash infra/aws/instancia/renderizar-borde.sh 8081 "$secreto" backend-preprod > "$conf/preprod.conf"
          # La descarga va aparte de la prueba: un registro que limita las descargas anonimas (pasa en los
          # runners compartidos: "toomanyrequests") no debe contarse como una configuracion invalida. Se
          # reintenta y, si el primer origen no responde, se prueba la misma imagen en otros dos.
          imagen=""
          # Con el mismo digest que compose-borde.yml: se prueba la nginx que de verdad va a correr.
          for origen in public.ecr.aws/nginx/nginx-unprivileged:alpine@sha256:378d0c32f6562f7fd9629170797f57d2b953aa09be983b3daaf4809bb039ca00 docker.io/nginxinc/nginx-unprivileged:alpine@sha256:378d0c32f6562f7fd9629170797f57d2b953aa09be983b3daaf4809bb039ca00 mirror.gcr.io/nginxinc/nginx-unprivileged:alpine@sha256:378d0c32f6562f7fd9629170797f57d2b953aa09be983b3daaf4809bb039ca00; do
            for intento in 1 2 3; do
              if docker pull --quiet "$origen"; then imagen="$origen"; break 2; fi
              echo "No se pudo bajar $origen (intento $intento de 3)"
              sleep $((intento * 10))
            done
          done
          [ -n "$imagen" ] || { echo "::error::No se pudo descargar la imagen de nginx de ningun registro"; exit 1; }
          # Es la imagen que usa compose-borde.yml; el secreto no es el real y no sale en el log.
          docker run --rm -v "$conf:/etc/nginx/conf.d:ro" "$imagen" nginx -t

  imagenes-fijadas:
    name: Imagenes base fijadas por digest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Sin red: solo mira que ningun "FROM" ni "image:" haya vuelto a quedar con una etiqueta a secas (SCRUM-214).
      # Si el digest esta al dia lo dice infra/actualizar-imagenes-base.sh --ver, que se corre a mano.
      - run: bash infra/comprobar-imagenes-fijadas.sh

  # Un respaldo que nunca se ha restaurado es una esperanza, no un respaldo (12 factores, factor 12, SCRUM-219). Aqui se migra una
  # base vacia con el MISMO Flyway y las MISMAS migraciones, se le ponen cuentas de mentira, se respalda, se restaura en otra
  # base y se compara tabla por tabla. Si una migracion nueva rompe el respaldo (una restriccion, un tipo, un objeto sin
  # permiso), falla aqui y no el dia que se necesite. Contra Supabase se corre a mano: infra/operacion/probar-respaldo.sh.
  respaldo-restaurable:
    name: El respaldo de la base se puede restaurar
    runs-on: ubuntu-latest
    services:
      bd:
        # Mismo digest que docker-compose.yml, bajado de ECR Publico (Docker Hub limita las descargas anonimas).
        image: public.ecr.aws/docker/library/postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_PASSWORD: contrasena-del-ci
          POSTGRES_DB: cundiapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cundiapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DB_URL: jdbc:postgresql://localhost:5432/cundiapp
      DB_USERNAME: postgres
      DB_PASSWORD: contrasena-del-ci
      # Las herramientas del respaldo, de la misma version y el mismo digest que el servidor.
      IMAGEN_PG: public.ecr.aws/docker/library/postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    steps:
      - uses: actions/checkout@v7
      - name: Revisar los scripts de operacion (ShellCheck) y probar la comparacion
        run: |
          set -euo pipefail
          shellcheck -x -P SCRIPTDIR infra/operacion/*.sh
          bash infra/operacion/probar-comparacion.sh
      - name: Bajar las imagenes (con reintentos)
        run: |
          for imagen in flyway/flyway:11 "$IMAGEN_PG"; do
            for intento in 1 2 3; do
              docker pull --quiet "$imagen" && break
              [ "$intento" -lt 3 ] || { echo "::error::No se pudo bajar $imagen"; exit 1; }
              sleep $((intento * 10))
            done
          done
      - name: Migrar una base vacia con Flyway
        run: |
          CONFIRMO_MIGRAR_EN=localhost bash infra/operacion/migrar-a-mano.sh migrate
          bash infra/operacion/migrar-a-mano.sh validate
      - name: Poner cuentas de mentira (hay restricciones que exigen un metodo de acceso por cuenta)
        run: |
          docker run --rm --network host -e PGPASSWORD="$DB_PASSWORD" "$IMAGEN_PG" \
            psql -h localhost -U postgres -d cundiapp -v ON_ERROR_STOP=1 -q -c "
              set search_path=cundiapp;
              begin;
              with e as (
                insert into estudiante(nombres, apellidos, correo_institucional)
                select 'Prueba ' || g, 'Sintetico', 'prueba' || g || '@example.test' from generate_series(1, 25) g
                returning id_estudiante, correo_institucional)
              insert into credencial_acceso(id_estudiante, proveedor, hash_contrasena, correo_proveedor, correo_verificado)
              select id_estudiante, 'local', 'x', correo_institucional, true from e;
              commit;"
      - name: Respaldar, restaurar en una base desechable y comparar
        run: bash infra/operacion/probar-respaldo.sh
