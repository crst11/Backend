name: CI

on:
  pull_request:
    branches: [desarrollo, preproduccion, produccion]

jobs:
  verificar:
    name: Compilar, probar y verificar arquitectura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: mvnw verify
        run: ./mvnw -B verify

  dependencias:
    name: Dependencias sin vulnerabilidades conocidas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # OSV-Scanner mira cada dependencia de pom.xml (tambien las transitivas) contra la base de
      # vulnerabilidades OSV, sin llave ni cuenta. Falla con cualquier aviso que no este en
      # osv-scanner.toml; ahi se documenta cada excepcion, con motivo y fecha limite.
      - name: Escanear pom.xml
        run: >
          docker run --rm -v "$PWD:/src:ro" ghcr.io/google/osv-scanner:v2.7.0
          scan source --config=/src/osv-scanner.toml --lockfile=/src/pom.xml
