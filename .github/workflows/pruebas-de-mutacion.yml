name: Pruebas de mutacion

# PIT (SCRUM-242) cambia el codigo del dominio con errores pequenos y comprueba que alguna prueba falle. Tarda unos 7 minutos (miles de
# mutaciones, cada una con sus pruebas), por eso no corre en cada pull request: se lanza a mano desde Actions cuando se toca el dominio
# y una vez por semana, para que un cambio que debilite las pruebas no pase desapercibido. Falla si el porcentaje de mutaciones
# eliminadas baja del umbral de pom.xml (perfil "mutacion").
on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * 1' # lunes 6 a. m. hora de Colombia

permissions:
  contents: read

jobs:
  mutacion:
    name: Mutaciones del dominio
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Correr PIT
        run: ./mvnw -B -Pmutacion test-compile org.pitest:pitest-maven:mutationCoverage

      - name: Guardar el informe
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: informe-de-mutacion
          path: target/pit-reports
          retention-days: 30
